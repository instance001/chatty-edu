[package]
name = "chatty-edu"
version = "0.5.0"
edition = "2021"
default-run = "chatty-edu"
authors = ["Instance001 + Symbound Collective"]
description = "Chatty-EDU - A modular local-first learning assistant built on Rust."
license = "AGPL-3.0-or-later"

[features]
default = ["local-model"]
local-model = ["dep:llama-cpp-2", "dep:once_cell", "dep:parking_lot", "dep:encoding_rs"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.27"
image = { version = "0.25", default-features = false, features = ["png"] }
module_host_support = { path = "module_host_support" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.14"
llama-cpp-2 = { version = "0.1.138", default-features = false, optional = true }
once_cell = { version = "1.19", optional = true }
parking_lot = { version = "0.12", optional = true }
encoding_rs = { version = "0.8", optional = true }
sha2 = "0.10"
deunicode = "1.6"
tao = "0.35"
url = "2"
wry = "0.55"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
llama-cpp-sys-2 = { path = "thirdparty/llama-cpp-sys-2" }
